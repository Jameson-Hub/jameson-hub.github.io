<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker — Jameson Bagain</title>
  <meta name="description" content="A small expense tracker: add, edit and delete expenses, see monthly totals and where the money goes, and export to CSV." />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../mini.css" />
  <link rel="stylesheet" href="expenses.css" />
  <!-- Umami analytics (cookieless) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="95001d0a-5658-4602-acd8-d618714c005c" data-domains="jameson-hub.github.io"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="back" href="../../index.html#mini">← Portfolio</a>
      <h1 class="app-name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Expenses</h1>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="add" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add expense</span></button>
    </div>
  </header>

  <main class="wrap">
    <div class="month-bar">
      <button class="btn btn-icon" id="prev" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <h2 class="month" id="month" aria-live="polite"></h2>
      <button class="btn btn-icon" id="next" type="button" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <span class="spacer"></span>
      <select class="input currency" id="currency" aria-label="Currency">
        <option value="PHP">₱ PHP</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
        <option value="JPY">¥ JPY</option>
      </select>
    </div>

    <dl class="summary" id="summary"></dl>

    <div class="charts">
      <section class="card">
        <h2 class="card-title">By category</h2>
        <ol class="cats" id="cats"></ol>
      </section>
      <section class="card daily-card">
        <h2 class="card-title">Daily spending</h2>
        <div class="daily" id="daily"></div>
        <div class="tip" id="tip" hidden></div>
      </section>
    </div>

    <section class="card list-card">
      <div class="toolbar">
        <input class="input" id="search" type="search" placeholder="Search expenses…" aria-label="Search expenses" />
        <select class="input" id="filter" aria-label="Filter by category"><option value="">All categories</option></select>
        <button class="btn" id="export" type="button">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Category</th><th scope="col" class="num">Amount</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <p class="reset">Data stays in your browser. <button class="linkish" id="reset" type="button">Reset demo data</button></p>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="form">
      <h2 id="dialog-title">Add expense</h2>
      <label class="field"><span>Description</span><input class="input" name="note" required maxlength="80" placeholder="e.g. Groceries" /></label>
      <div class="form-row">
        <label class="field"><span>Amount</span><input class="input" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required /></label>
        <label class="field"><span>Date</span><input class="input" name="date" type="date" required /></label>
      </div>
      <label class="field"><span>Category</span><select class="input" name="category" id="category"></select></label>
      <div class="dialog-actions">
        <button class="btn btn-danger left" id="delete" type="button">Delete</button>
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-primary" value="save" id="save">Add expense</button>
      </div>
    </form>
  </dialog>

  <p class="foot">Built by Jameson Bagain · HTML, CSS &amp; JS</p>
  <script src="expenses.js"></script>
</body>
</html>
