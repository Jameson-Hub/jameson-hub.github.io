<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather — Jameson Bagain</title>
  <meta name="description" content="A small weather app: search any city for current conditions, the next 24 hours and a 7-day forecast." />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../mini.css" />
  <link rel="stylesheet" href="weather.css" />
  <!-- Umami analytics (cookieless) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="95001d0a-5658-4602-acd8-d618714c005c" data-domains="jameson-hub.github.io"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="back" href="../../index.html#mini">← Portfolio</a>
      <h1 class="app-name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Weather</h1>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Units">
        <button type="button" data-unit="celsius" aria-pressed="true">°C</button>
        <button type="button" data-unit="fahrenheit" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="search">
      <form class="search-box" id="search-form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search a city…" aria-label="Search a city" aria-controls="results" aria-expanded="false" />
        <ul class="results" id="results" role="listbox" hidden></ul>
      </form>
      <button class="btn" id="locate" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg><span>My location</span></button>
    </div>
    <div class="recent" id="recent"></div>

    <p class="status" id="status" role="status"></p>

    <div class="grid" id="weather" hidden>
      <section class="card now">
        <div>
          <p class="place" id="place"></p>
          <p class="when" id="when"></p>
        </div>
        <div class="now-main">
          <span class="now-icon" id="now-icon"></span>
          <span class="now-temp" id="now-temp"></span>
        </div>
        <p class="now-desc" id="now-desc"></p>
        <dl class="facts">
          <div><dt>Feels like</dt><dd id="feels"></dd></div>
          <div><dt>Humidity</dt><dd id="humidity"></dd></div>
          <div><dt>Wind</dt><dd id="wind"></dd></div>
          <div><dt>Rain chance</dt><dd id="rain"></dd></div>
          <div><dt>Sunrise</dt><dd id="sunrise"></dd></div>
          <div><dt>Sunset</dt><dd id="sunset"></dd></div>
        </dl>
      </section>

      <section class="card hourly-card">
        <h2 class="card-title">Next 24 hours</h2>
        <ol class="hourly" id="hourly"></ol>
      </section>

      <section class="card week-card">
        <h2 class="card-title">7-day forecast</h2>
        <ol class="week" id="week"></ol>
      </section>
    </div>
  </main>

  <p class="foot">Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Built by Jameson Bagain</p>
  <script src="weather.js"></script>
</body>
</html>
